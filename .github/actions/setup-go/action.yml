name: Setup Go
description: Install Go for an infra/ module using its go.mod, with go.work-aware caching.

inputs:
  module:
    description: Module directory name under infra/ (e.g. crawler, publisher, sqliteutil).
    required: true
  cache:
    description: Whether to enable Go build/module caching.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Setup Go
      uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: infra/${{ inputs.module }}/go.mod
        cache: ${{ inputs.cache }}
        cache-dependency-path: |
          infra/${{ inputs.module }}/go.sum
          infra/go.work.sum
