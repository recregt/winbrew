sources:
  - scoop
  - winget

logLevel: info

timeout:
  fetch: 5m

# See "Crawler Backoff" in docs/pipeline.md: start at 1s, double each retry,
# stop after 5 attempts. That gives ~15s of retry budget before giving up on
# a single manifest, enough to ride out sustained Winget throttling during
# the deep manifest walk.
retry:
  max: 5
  backoff: 1s
