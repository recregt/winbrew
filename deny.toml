[graph]
targets = ["x86_64-pc-windows-msvc"]
all-features = true

[advisories]
unmaintained = "workspace"
unsound = "all"
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
skip = []
skip-tree = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "CC0-1.0",
    "MIT-0",
]
exceptions = [
    # bzip2 and libbzip2's own permissive license text isn't a standard SPDX
    # identifier, so it can't go in the general allow list above -- scoped
    # to just this crate instead of allowing "bzip2-1.0.6" project-wide.
    { crate = "libbz2-rs-sys", allow = ["bzip2-1.0.6"] },
]
