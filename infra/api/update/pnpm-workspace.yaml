overrides:
  undici: 8.9.0
  vite: "8.2.0"
  esbuild: ">=0.28.1"
  ws: ">=8.21.0"
  postcss: 8.5.25
  sharp: 0.35.3

packages:
  - '.'

allowBuilds:
  esbuild: true
  sharp: true
  workerd: true

# Supply-chain hardening: wait 7 days before installing newly published
# versions, refuse transitive deps sourced from anywhere but the configured
# registry, and never let a dependency update silently loosen these settings.
minimumReleaseAge: 10080
blockExoticSubdeps: true
trustPolicy: no-downgrade