name: Update API Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'infra/api/update/**'
      - '.github/workflows/update-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-api-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and Deploy Update Worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    defaults:
      run:
        shell: bash
        working-directory: infra/api/update

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Replaces pnpm/action-setup + actions/setup-node: pnpm/action-setup's
      # own README now points to pnpm/setup as the successor for pnpm v11+
      # (which infra/api/update/package.json's "packageManager" field pins).
      # It installs pnpm's self-contained release binary directly and can
      # install Node in the same step, verifying the installed pnpm binary
      # against its published digest along the way.
      - name: Setup pnpm and Node
        uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
        with:
          runtime: node@24
          install: false
          cache: true
          cache-dependency-path: infra/api/update/pnpm-lock.yaml
          # Both paths are relative to GITHUB_WORKSPACE (the repo root), not
          # to the job's `defaults.run.working-directory` -- that default
          # only applies to `run:` steps, not to this action's own inputs.
          package-json-file: infra/api/update/package.json

      - name: Install dependencies
        # --trust-lockfile: the committed lockfile is the reviewed, trusted
        # base (per pnpm's own guidance for CI); this skips re-running the
        # minimumReleaseAge/trustPolicy supply-chain check against every
        # already-approved entry on every CI run. Renovate PRs that bump the
        # lockfile still go through the full policy when they're generated.
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Run tests
        run: pnpm test -- --run

      - name: Deploy worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy -c ./wrangler.jsonc