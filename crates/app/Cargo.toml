[package]
name = "winbrew-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true
build = "build.rs"

[dependencies]
anyhow.workspace = true
rusqlite = { version = "0.40", default-features = false, features = ["bundled", "modern_sqlite", "unlock_notify", "hooks"] }
serde.workspace = true
url = "2"
winbrew-core = { path = "../core" }
winbrew-models = { path = "../models" }
winbrew-database = { path = "../database" }
winbrew-engines = { path = "../engines" }
serde_json = "1"
thiserror = "2.0"
tracing.workspace = true
zstd = "0.13"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
tempfile = "3"
winbrew-testing = { path = "../testing" }

[build-dependencies]
winresource = "0.1"

# cargo-machete doesn't scan build.rs, so it can't see winresource is used
# there to embed the Windows icon/version resource.
[package.metadata.cargo-machete]
ignored = ["winresource"]

[[bench]]
name = "doctor_health_report"
harness = false

[target.'cfg(windows)'.dependencies]
winbrew-windows = { path = "../windows" }