name: Setup Rust
description: Install the pinned stable Rust toolchain and restore/save the cargo build cache.

inputs:
  save-if:
    description: Passed through to Swatinem/rust-cache's save-if input.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      with:
        save-if: ${{ inputs.save-if }}
