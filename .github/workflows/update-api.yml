name: Update API Deploy

on:
  push:
    branches:
      - main
    paths:
      - 'infra/api/update/**'
      - '.github/workflows/update-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-api-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and Deploy Update Worker
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

    defaults:
      run:
        shell: bash
        working-directory: infra/api/update

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: infra/api/update/pnpm-lock.yaml

      - name: Install dependencies
        # --trust-lockfile: the committed lockfile is the reviewed, trusted
        # base (per pnpm's own guidance for CI); this skips re-running the
        # minimumReleaseAge/trustPolicy supply-chain check against every
        # already-approved entry on every CI run. Renovate PRs that bump the
        # lockfile still go through the full policy when they're generated.
        run: pnpm install --frozen-lockfile --trust-lockfile

      - name: Run tests
        run: pnpm test -- --run

      - name: Deploy worker
        run: pnpm exec wrangler deploy -c ./wrangler.jsonc