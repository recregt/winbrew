name: CI
on:
  push:
    branches:
      - main

defaults:
  run:
    shell: bash

permissions:
  contents: read

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.11.4
  CARGO_NEXTEST_VERSION: 0.9.132

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      go: ${{ steps.filter.outputs.go }}
      workflows: ${{ steps.filter.outputs.workflows }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        with:
          filters: .github/filters.yml

  conclusion:
    needs:
      - changes
      - go
      - doc
      - spellcheck
      - rust-parser
      - rust
    permissions:
      contents: none
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Conclusion
        run: |
          jq -C <<< '${{ toJson(needs) }}'
          # A job gated by the changes filter reports "skipped" when its
          # language didn't change -- that's a pass, not a failure. Only
          # "failure"/"cancelled" should fail the build here.
          jq --exit-status 'all(.result == "success" or .result == "skipped")' <<< '${{ toJson(needs) }}'

  go:
    name: Go › ${{ matrix.module }}
    needs: changes
    if: needs.changes.outputs.go == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        module:
          - crawler
          - publisher
          - sqliteutil
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: ./.github/actions/setup-go
        with:
          module: ${{ matrix.module }}
          cache: ${{ github.event_name == 'push' }}

      - name: Install golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-only: true

      - name: Run Go CI Script
        shell: pwsh
        run: ./scripts/ci/check/go.ps1 -Module ${{ matrix.module }}

  rust-parser:
    name: Rust › Catalog Parser
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Run Catalog Parser CI Script
        shell: pwsh
        run: ./scripts/ci/check/rust-parser.ps1

  doc:
    name: doc
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: windows-latest
    environment: production
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build Docs
        shell: bash
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail

          cargo doc --locked --workspace --document-private-items --no-deps
          printf '%s\n' '/ /winbrew/ 301' '/index.html /winbrew/ 301' > target/doc/_redirects

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3.15.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy target/doc --project-name=winbrew --branch=main --commit-dirty=true

  spellcheck:
    name: Spell Check with Typos
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Spell Check Repo
        uses: crate-ci/typos@bee27e3a4fd1ea2111cf90ab89cd076c870fce14 # v1.48.0

  rust:
    name: Rust
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflows == 'true'
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-if: ${{ github.event_name == 'push' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-nextest@${{ env.CARGO_NEXTEST_VERSION }}

      - name: Install cargo-machete
        uses: taiki-e/install-action@1beb33eee6d086258184383af9a538940be190ed # v2.85.6
        with:
          tool: cargo-machete

      - name: Check for unused dependencies
        # --with-metadata: plain text-search mode has a false positive on
        # md-5 in winbrew-core (real usage cargo-machete's naive scan
        # misses); metadata mode resolves it correctly.
        run: cargo machete --with-metadata

      - name: Run Rust CI Script
        shell: pwsh
        run: ./scripts/ci/check/rust.ps1

      - name: Smoke test CLI
        shell: pwsh
        run: ./scripts/ci/smoke.ps1 -BinaryPath 'target\x86_64-pc-windows-msvc\release\winbrew.exe' -ROOT 'target\winbrew-ci'
